<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Make Your Point - Share Your Perspective</title>
    <meta name="description" content="A responsive full-stack platform for the Silent Majority, the Forgotten, and the Unheard to share their successes, failures, and points in the AIonisphere." />
    <meta property="og:title" content="Make Your Point - Share Your Perspective" />
    <meta property="og:description" content="A responsive full-stack platform for the Silent Majority, the Forgotten, and the Unheard to share their successes, failures, and points in the AIonisphere." />
    <meta property="og:type" content="website" />
    <script>
      (function () {
        try {
          var t = localStorage.getItem('theme');
          if (t === 'dark') {
            document.documentElement.classList.add('dark');
            document.documentElement.style.colorScheme = 'dark';
          } else {
            document.documentElement.classList.remove('dark');
            document.documentElement.style.colorScheme = 'light';
          }
        } catch (e) {}
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
